default: &default
  adapter: postgresql
  encoding: utf8
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  username: <%= ENV.fetch("DATABASE_USERNAME", "diario") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "diario") %>
  host: <%= ENV.fetch("DATABASE_HOST", "postgres") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "diario_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "diario_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME", "diario") %>
