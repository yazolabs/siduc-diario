x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.prod
  environment:
    RAILS_ENV: production
    RACK_ENV: production
    NODE_ENV: production
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_USERNAME: ${POSTGRES_USER:-diario}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-diario}
    DATABASE_NAME: ${POSTGRES_DB:-diario}
    REDIS_URL: redis://redis:6379
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DEVISE_SECRET_KEY: ${DEVISE_SECRET_KEY}
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
    ENTITY_NAME: ${ENTITY_NAME:-diario}
    ENTITY_DOMAIN: ${ENTITY_DOMAIN:-localhost}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: always

services:
  web:
    <<: *app
    entrypoint: ["bash", "-lc", "./docker/entrypoint.prod.sh bundle exec rails server -b 0.0.0.0 -p 3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -c 10
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q sidekiq"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  sidekiq-enqueue:
    <<: *app
    command: bundle exec sidekiq -q synchronizer_enqueue_next_job -q synchronizer_enqueue_next_job_full -c 1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q sidekiq"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  sidekiq-synchronizer:
    <<: *app
    command: bundle exec sidekiq -q synchronizer -c 1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q sidekiq"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  sidekiq-synchronizer-full:
    <<: *app
    command: bundle exec sidekiq -q synchronizer_full -c 1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q sidekiq"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  sidekiq-critical:
    <<: *app
    command: bundle exec sidekiq -q critical -c 1
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q sidekiq"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diario}
      POSTGRES_USER: ${POSTGRES_USER:-diario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diario}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diario} -d ${POSTGRES_DB:-diario}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres:
  redis:
