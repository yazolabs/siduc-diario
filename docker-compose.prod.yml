x-app: &app
  build:
    context: .
    dockerfile: Dockerfile.prod
  environment:
    RAILS_ENV: production
    RACK_ENV: production
    NODE_ENV: production
    DATABASE_HOST: postgres
    DATABASE_PORT: 5432
    DATABASE_USERNAME: ${POSTGRES_USER:-diario}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-diario}
    DATABASE_NAME: ${POSTGRES_DB:-diario}
    REDIS_URL: redis://redis:6379
    SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    DEVISE_SECRET_KEY: ${DEVISE_SECRET_KEY}
    RAILS_LOG_TO_STDOUT: "true"
    RAILS_SERVE_STATIC_FILES: "true"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    <<: *app
    command: bundle exec rails server -b 0.0.0.0 -p 3000
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  sidekiq:
    <<: *app
    command: bundle exec sidekiq -c 10
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q \"sidekiq\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  sidekiq-enqueue:
    <<: *app
    command: bundle exec sidekiq -q synchronizer_enqueue_next_job -q synchronizer_enqueue_next_job_full -c 1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q \"sidekiq\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  sidekiq-synchronizer:
    <<: *app
    command: bundle exec sidekiq -q synchronizer -c 1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q \"sidekiq\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  sidekiq-synchronizer-full:
    <<: *app
    command: bundle exec sidekiq -q synchronizer_full -c 1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q \"sidekiq\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  sidekiq-critical:
    <<: *app
    command: bundle exec sidekiq -q critical -c 1
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q \"sidekiq\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diario}
      POSTGRES_USER: ${POSTGRES_USER:-diario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diario}
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis:/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres:
  redis:
